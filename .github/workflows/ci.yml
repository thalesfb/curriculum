name: CI/CD

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'data/**'
      - 'cv/**'
      - 'scripts/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'tsconfig.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main, feat/s1-cv-content]
  workflow_dispatch:

jobs:
  # =============================================================================
  # Test & Build
  # =============================================================================
  test:
    runs-on: ubuntu-latest
    name: Test & Build

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Poppler validation tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils

      - name: Install Typst 0.15.1
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/typst/typst/releases/download/v0.15.1/typst-x86_64-unknown-linux-musl.tar.xz \
            --output "$RUNNER_TEMP/typst.tar.xz"
          echo "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c  $RUNNER_TEMP/typst.tar.xz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/typst-bin"
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP/typst-bin"
          install -m 0755 "$RUNNER_TEMP/typst-bin/typst-x86_64-unknown-linux-musl/typst" "$RUNNER_TEMP/typst"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/typst" --version | grep -E '^typst 0\.15\.1 '

      - name: Security audit
        run: npm audit --audit-level=critical

      - name: Run tests
        run: npm run test

      - name: Generate CV PDFs in temporary directory
        run: python scripts/build_cv_pdf.py

      - name: Run Python tests
        run: python -m unittest discover -s scripts/tests -v

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  # =============================================================================
  # Deploy to Production
  # =============================================================================
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: [test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    timeout-minutes: 10
    environment:
      name: production

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy dist/ to VPS
        uses: appleboy/scp-action@917f8b81dfc1ccd331fef9e2d61bdc6c8be94634 # v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: ${{ secrets.VPS_PORT }}
          source: dist/*
          target: ${{ secrets.VPS_PATH }}
          strip_components: 1
          overwrite: true
