name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch semantic-release notes
        continue-on-error: true
        run: git fetch origin '+refs/notes/*:refs/notes/*'

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Snapshot tags before release
        run: git tag --list 'v*' --sort=version:refname > "$RUNNER_TEMP/release-tags-before.txt"

      - name: Release
        id: semantic_release
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Publish GitHub Releases missing for existing tags
        id: reconcile_releases
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          created=0
          recovered_current_release=false
          before_file="$RUNNER_TEMP/release-tags-before.txt"
          highest_version_tag="$(git tag --list 'v*' | awk '/^v[0-9]+\.[0-9]+\.[0-9]+$/ { print }' | sort -V | tail -n 1)"

          while IFS= read -r tag; do
            [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || continue
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              continue
            fi

            target="$(git rev-parse "${tag}^{commit}")"
            latest_option=()
            if [[ "$tag" != "$highest_version_tag" ]]; then
              latest_option+=(--latest=false)
            fi
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$target" --generate-notes "${latest_option[@]}"
            created=$((created + 1))

            if ! grep -Fxq "$tag" "$before_file" && [[ "$target" == "$GITHUB_SHA" ]]; then
              recovered_current_release=true
            fi
          done < <(git tag --list 'v*' --sort=version:refname)

          echo "created=$created" >> "$GITHUB_OUTPUT"
          echo "recovered_current_release=$recovered_current_release" >> "$GITHUB_OUTPUT"

      - name: Fail if semantic release did not publish or recover its tag
        if: always()
        env:
          RELEASE_OUTCOME: ${{ steps.semantic_release.outcome }}
          RECOVERED_CURRENT_RELEASE: ${{ steps.reconcile_releases.outputs.recovered_current_release }}
        shell: bash
        run: |
          if [[ "$RELEASE_OUTCOME" == "success" ]]; then
            exit 0
          fi

          if [[ "$RELEASE_OUTCOME" == "failure" && "$RECOVERED_CURRENT_RELEASE" == "true" ]]; then
            echo "Recovered the missing GitHub Release for the tag created in this run."
            exit 0
          fi

          echo "semantic-release did not complete and no new release for this commit was recovered."
          exit 1
